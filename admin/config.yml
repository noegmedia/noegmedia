backend:
  name: github
  repo: noegmedia/noegmedia
  branch: main
  base_url: https://sveltia-cms-auth.pages.dev

media_folder: "img/noticias"
public_folder: "/img/noticias"

locale: "es"

collections:
  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "noticias"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "noticias/{{slug}}.html"
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"
        hint: "El titular de la noticia"

      - label: "Fecha de publicación"
        name: "fecha"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false

      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "NoéGMedia", value: "noegmedia" }
          - { label: "Streaming", value: "streaming" }
          - { label: "Filmmaking", value: "filmmaking" }
          - { label: "Creative", value: "creative" }
          - { label: "Marbella", value: "marbella" }
          - { label: "Sector", value: "sector" }

      - label: "Resumen"
        name: "resumen"
        widget: "text"
        hint: "1-2 frases que aparecen en la tarjeta de la noticia"

      - label: "Emoji"
        name: "emoji"
        widget: "string"
        default: "📰"
        hint: "Un emoji que representa la noticia (📡 🎬 ✦ 🌊 🚀 🎥)"

      - label: "Publicado"
        name: "publicado"
        widget: "boolean"
        default: true

      - label: "Contenido"
        name: "body"
        widget: "markdown"
