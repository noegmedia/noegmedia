backend:
  name: git-gateway
  branch: main

media_folder: img/uploads
public_folder: /img/uploads

locale: es

collections:

  # ─── NOTICIAS ─────────────────────────────────────────────────────────────
  - name: noticias
    label: Noticias
    label_singular: Noticia
    folder: noticias
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "noticias/{{slug}}.html"
    fields:
      - { label: Título,    name: titulo,    widget: string }
      - { label: Fecha,     name: fecha,     widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: Categoría
        name: categoria
        widget: select
        options:
          - { label: "NoéGMedia", value: "NoéGMedia" }
          - { label: "Streaming", value: "Streaming" }
          - { label: "Filmmaking", value: "Filmmaking" }
          - { label: "Creative",  value: "Creative" }
          - { label: "Marbella",  value: "Marbella" }
          - { label: "Sector",    value: "Sector" }
      - { label: Resumen,   name: resumen,   widget: text,   hint: "1-2 frases para la tarjeta" }
      - { label: Emoji,     name: emoji,     widget: string, default: "📰", hint: "📡 🎬 ✦ 🌊 🚀 🎥" }
      - { label: Publicado, name: publicado, widget: boolean, default: true }
      - { label: Contenido, name: body,      widget: markdown }

  # ─── BLOG ─────────────────────────────────────────────────────────────────
  - name: blog
    label: Blog
    label_singular: Artículo
    folder: blog
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}.html"
    fields:
      - { label: Título,    name: titulo,    widget: string,  hint: "Título del artículo" }
      - { label: Fecha,     name: fecha,     widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: Categoría
        name: categoria
        widget: select
        options:
          - { label: "Streaming",            value: "Streaming" }
          - { label: "Filmmaking",           value: "Filmmaking" }
          - { label: "Producción",           value: "Producción" }
          - { label: "Equipamiento",         value: "Equipamiento" }
          - { label: "Redes Sociales",       value: "Redes Sociales" }
          - { label: "Televisión",           value: "Televisión" }
          - { label: "Diseño Digital",       value: "Diseño Digital" }
          - { label: "Marbella",             value: "Marbella" }
          - { label: "Opinión",              value: "Opinión" }
      - { label: Resumen,   name: resumen,   widget: text,    hint: "1-2 frases. Aparece en la tarjeta y en LinkedIn al compartir" }
      - { label: Emoji,     name: emoji,     widget: string,  default: "📝", hint: "📡 🎬 🎙️ 📷 💻 🎨 📺" }
      - { label: Tags,      name: tags,      widget: string,  hint: "Separados por comas: streaming, multicámara, marbella", required: false }
      - { label: Publicado, name: publicado, widget: boolean, default: true }
      - { label: Contenido, name: body,      widget: markdown, hint: "Escribe el artículo completo aquí" }
