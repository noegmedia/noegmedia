name: Construir Noticias

on:
  push:
    branches: [main]
    paths:
      - 'noticias/**.md'
      - 'build-noticias.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de build
        run: node build-noticias.js

      - name: Subir HTMLs generados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias/ noticias.html
          git diff --staged --quiet || git commit -m "🤖 Build: noticias generadas"
          git push
